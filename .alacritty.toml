[scrolling]
history = 100000

[keyboard]
bindings = [
  { key = "N", mods = "Command", action = "CreateNewWindow" }
]

[font]
size = 14
normal.family = "Iosevka Term"
# For some reason this is needed with Iosevka
normal.style = "Regular"

[window]
padding.x = 6
padding.y = 6

[colors.cursor]
background = '#00FF80'
text = '#004020'


[colors]
draw_bold_text_with_bright_colors = true

[colors.normal]
red = '#ff0074'
yellow = '#ff8400'
green = '#2dee00'
cyan = '#00feff'
blue = '#00b3ff'
magenta = '#ff4cff'
black = '#151515'
white = '#bdbdbd'
[colors.bright]
red = '#ff1900'
yellow = '#ecc400'
green = '#00ff84'
cyan = '#00e1ff'
blue = '#bc7fff'
magenta = '#ff00f7'
black = '#474747'
white = '#fefefe'
[colors.primary]
background = '#000000'
dim_foreground = '#808080'
foreground = '#bdbdbd'
bright_foreground = '#fefefe'
